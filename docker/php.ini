expose_php = Off
memory_limit = 256M
upload_max_filesize = 12M
post_max_size = 48M
max_file_uploads = 30
max_execution_time = 120
date.timezone = Africa/Lagos
display_errors = Off
log_errors = On
session.cookie_httponly = 1
session.use_strict_mode = 1
session.gc_maxlifetime = 86400
opcache.enable = 1
opcache.validate_timestamps = 0
