ServerName localhost
ServerTokens Prod
ServerSignature Off
TraceEnable Off
<Directory /var/www/html>
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>
# Never serve these folders, even if .htaccess is missing on a mounted disk
<DirectoryMatch "^/var/www/html/(storage|backups|includes|cli|docker)(/|$)">
    Require all denied
</DirectoryMatch>
<DirectoryMatch "^/var/data/(storage|backups)(/|$)">
    Require all denied
</DirectoryMatch>
