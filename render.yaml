# Render Blueprint — Mojhometouch website
services:
  - type: web
    name: mojhometouch
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: frankfurt
    autoDeploy: true
    healthCheckPath: /healthz.php
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: TRUST_PROXY
        value: "1"
      - key: ADMIN_EMAIL
        value: admin@mojhometouch.com
      - key: ADMIN_PASSWORD
        value: Moj@Admin2026
      - key: GITHUB_BACKUP_REPO
        value: ElDera7/mojhometouch
      - key: GITHUB_BACKUP_BRANCH
        value: db-backup
